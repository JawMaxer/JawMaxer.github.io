<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JawMaxer</title>

<style>

body{
margin:0;
font-family:Arial;
background:#111;
color:white;
text-align:center;
}

header{
padding:60px;
}

h1{
font-size:60px;
letter-spacing:4px;
}

.product{
max-width:900px;
margin:60px auto;
background:#1a1a1a;
padding:30px;
border-radius:12px;
}

.gallery{
display:flex;
gap:20px;
justify-content:center;
flex-wrap:wrap;
}

.gallery img{
width:250px;
border-radius:10px;
}

.beforeafter{
display:flex;
gap:20px;
justify-content:center;
margin-top:20px;
}

.beforeafter img{
width:300px;
border-radius:10px;
}

button{
padding:12px 30px;
background:white;
color:black;
border:none;
font-weight:bold;
cursor:pointer;
margin-top:20px;
}

.cart{
position:fixed;
top:20px;
right:20px;
background:#222;
padding:10px 20px;
border-radius:10px;
}

</style>
</head>

<body>

<div class="cart">
Cart: <span id="cart">0</span>
</div>

<header>

<h1>JAWMAXER</h1>
<p>Opbyg en stærkere kæbelinje</p>

</header>

<div class="product">

<h2>JawMaxer Gum</h2>

<div class="gallery">

<img src="jawmaxer-product-1.png">
<img src="jawmaxer-product-2.png">
<img src="jawmaxer-product-3.png">

</div>

<p>Tyggegummi der træner din jawline.</p>

<button onclick="add()">Pre-order</button>

<div class="beforeafter">

<img src="jawmaxer-before.png">
<img src="jawmaxer-after.png">

</div>

</div>

<div class="product">

<h2>Cleanser</h2>

<div class="gallery">

<img src="cleanser-1.png">
<img src="cleanser-2.png">
<img src="cleanser-3.png">

</div>

<p>Dybderensende cleanser.</p>

<button onclick="add()">Pre-order</button>

<div class="beforeafter">

<img src="cleanser-before.png">
<img src="cleanser-after.png">

</div>

</div>

<div class="product">

<h2>Moisturizer</h2>

<div class="gallery">

<img src="moisturizer-1.png">
<img src="moisturizer-2.png">
<img src="moisturizer-3.png">

</div>

<p>Fugter huden og giver et sundt look.</p>

<button onclick="add()">Pre-order</button>

<div class="beforeafter">

<img src="moisturizer-before.png">
<img src="moisturizer-after.png">

</div>

</div>

<div class="product">

<h2>Beta-Carotene</h2>

<div class="gallery">

<img src="beta-1.png">
<img src="beta-2.png">
<img src="beta-3.png">

</div>

<p>Giver en varmere hudtone.</p>

<button onclick="add()">Pre-order</button>

<div class="beforeafter">

<img src="beta-before.png">
<img src="beta-after.png">

</div>

</div>

<script>

let cart = 0;

function add(){
cart++;
document.getElementById("cart").innerText = cart;
alert("Produkt tilføjet til cart");
}

</script>

</body>
</html>
